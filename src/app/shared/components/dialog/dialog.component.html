<div class="dialog-cotainer" (click)="containerClose()">
	<div class="dialog-body" [class.dialog-error]="type === 'error'">
		@if (type === 'error') {
			<div class="dialog-error-icon">
				<img src="assets/images/fi_alert-circle.svg" alt="error">
			</div>
		}
		<h1 class="uppercase">
            {{title}}
        </h1>
        @if (item) {
            <p class="uppercase">
                {{item}}
            </p>
        }
		<p style="text-align: center;" [innerHTML]="message"></p>

        <div class="options">
            @switch (type) {
                @case ('confirmation') {
                    <button mat-raised-button class="submit small" (click)="confirm()">{{confirmText}}</button>
                    <button mat-raised-button class="cancel small" (click)="close()">{{ cancelText}}</button>
                }
                @case ('choose') {
                    <button mat-raised-button class="submit small" (click)="confirm()">{{confirmText}}</button>
                    <button mat-raised-button class="cancel small" (click)="cancel()">{{ cancelText}}</button>
                }
                @case ('alert') {
                    <button mat-raised-button class="submit small btn-purpple" (click)="close()">{{'Ok'}}</button>
                }
                @case ('error') {
                    <button mat-raised-button class="submit small btn-error" (click)="close()">{{confirmText}}</button>
                }
            }
        </div>
	</div>
</div>
